spring:
  main:
    banner-mode: off

map:
  visited-area:
    output-path: "d:\\Garmin\\data\\visited-area-small.geojson"

fit:
  files-scanner:
    directory-paths: 
      - "d:\\Garmin\\data\\2026-11-fit\\"

  file-renamer:
    enabled: false

activity-processing:
    walking-avg-pace-time:
        - name: "Listopadová rychlostní chůze"
          start-date: 2026-11-01T00:00:01
          end-date: 2026-11-30T23:59:59
          required-duration: PT3H
          max-average-pace: 10.5
    meditation-days:
        - name: "Listopadové meditace"
          start-date: 2026-11-01T00:00:01
          end-date: 2026-11-30T23:59:59
          required-days: 7
    walking-hr-zones:
        - name: "Listopadová chůze pro srdce"
          start-date: 2026-11-01T00:00:01
          end-date: 2026-11-30T23:59:59
          required-duration: PT3H
          required-zones: [2, 3]
    #running-descents:
        #- name: "Říjnové seběhy"
        #  start-date: 2026-10-01T00:00:01
        #  end-date: 2026-10-30T23:59:59
