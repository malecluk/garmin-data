spring:
  main:
    banner-mode: off

fit:
  mesg-dto-printer:
    disable-all-prints: false
    print-file-id-mesg: true
    print-activity-mesg: false
    print-device-info-mesg: true
    print-device-settings-mesg: false
    print-hr-zone-mesg: false
    print-lap-mesg: false
    print-session-mesg: false
    print-sport-mesg: false
    print-time-in-zone-mesg: false
    print-timestamp-correlation-mesg: false
    print-user-profile-mesg: false
    print-zones-target-mesg: false
    print-set-mesg: false

  files-scanner:
    directory-paths: 
      - "d:\\Garmin\\data\\2029-09-fit\\"
      - "d:\\Garmin\\data\\2029-10-fit\\"

  file-renamer:
    enabled: false

