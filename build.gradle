plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
    
    maven {
        // repo for geo tools
        url = uri("https://repo.osgeo.org/repository/release/")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

configurations {
    // for Mockito as Java Agent
    mockitoAgent
}

configurations.configureEach {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
}

dependencies {

    // Spring Boot
    implementation('org.springframework.boot:spring-boot-starter') {
        // To exclude default Logback in favour to Log4j
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
    
    // log4j driven by Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    
    // Garmin FIT SDK for reading .FIT files
    implementation 'com.garmin:fit:21.217.0'
    
    implementation 'org.locationtech.jts:jts-core:1.20.0'
    implementation 'org.locationtech.jts.io:jts-io-common:1.20.0'
    
    // Geo Tools
    implementation 'org.geotools:gt-main:34.0'
    implementation 'org.geotools:gt-referencing:34.0'
    implementation 'org.geotools:gt-epsg-hsql:34.0'
    
    // Spring Boot test framework
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    
    // Log4j core test framework
    testImplementation 'org.apache.logging.log4j:log4j-core-test'
    
    // for Mockito as Java Agent
    mockitoAgent('org.mockito:mockito-core') {
        transitive = false
    }
    
    constraints {
        implementation('tools.jackson.core:jackson-core:3.1.5') {
            because 'Fixes a vulnerability in jackson-core 3.1.5'
        }
        implementation('tools.jackson.core:jackson-databind:3.1.7') {
            because 'Fixes a vulnerability in jackson-databind 3.1.5'
        }
        implementation('org.apache.commons:commons-lang3:3.18.0') {
            because 'Fixes a vulnerability in commons-lang3 3.16.0'
        }
    }
}

tasks.named('test') {
    // turn on JUnit platform
    useJUnitPlatform()
    
    // for Mockito as Java Agent
    jvmArgs += "-javaagent:${configurations.mockitoAgent.singleFile}"
}

// add Jacoco Test Coverage Verification as part of tests
tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

// fail tests if coverage is less than selected minimum
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.85
            }
        }
    }
}

test {
    finalizedBy jacocoTestReport
}
